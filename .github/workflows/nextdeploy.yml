# VPS-only CI/CD workflow powered by NextDeploy.
#
# Application secrets do NOT belong here — manage runtime secrets on the VPS
# via `nextdeploy secrets` (or Doppler). Only VPS deploy credentials are wired below.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys per branch. Never cancel in-flight: a half-applied deploy
# is worse than a superseded one.
concurrency:
  group: nextdeploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Download the pinned, prebuilt release and verify its published checksum.
      - name: Install nextdeploy CLI (pinned)
        env:
          CLI_VERSION: "v1.0.0"
        run: |
          set -euo pipefail
          VERSION="${CLI_VERSION#v}"
          ARCHIVE="nextdeploy_${VERSION}_linux_amd64.tar.gz"
          RELEASE_URL="https://github.com/aynaash/NextDeploy/releases/download/${CLI_VERSION}"
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/nextdeploy.XXXXXX")"
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error "$RELEASE_URL/$ARCHIVE" --output "$TMP_DIR/$ARCHIVE"
          curl --fail --location --silent --show-error "$RELEASE_URL/checksums.txt" --output "$TMP_DIR/checksums.txt"
          (cd "$TMP_DIR" && awk -v archive="$ARCHIVE" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --status)
          tar -xzf "$TMP_DIR/$ARCHIVE" -C "$TMP_DIR" nextdeploy
          install -m 0755 "$TMP_DIR/nextdeploy" "$HOME/.local/bin/nextdeploy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy to VPS
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          NEXTDEPLOY_STRICT_HOST_KEY: ${{ secrets.NEXTDEPLOY_STRICT_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          RUN_PREFIX=""
          if [ -n "${DOPPLER_TOKEN:-}" ]; then
            if ! command -v doppler >/dev/null 2>&1; then
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh
            fi
            RUN_PREFIX="doppler run --"
            HOST=$(doppler secrets get VPS_HOST --plain 2>/dev/null || echo "$VPS_HOST")
            KEY=$(doppler secrets get SSH_PRIVATE_KEY --plain 2>/dev/null || echo "$SSH_PRIVATE_KEY")
            HOSTS=$(doppler secrets get SSH_KNOWN_HOSTS --plain 2>/dev/null || echo "$SSH_KNOWN_HOSTS")
            SSH_KEY_PASSPHRASE=$(doppler secrets get SSH_KEY_PASSPHRASE --plain 2>/dev/null || echo "$SSH_KEY_PASSPHRASE")
            export SSH_KEY_PASSPHRASE
          else
            HOST="$VPS_HOST"
            KEY="$SSH_PRIVATE_KEY"
            HOSTS="$SSH_KNOWN_HOSTS"
          fi
          if [ -n "$HOST" ]; then
            sed -i "s|\${VPS_HOST}|$HOST|g" nextdeploy.yml
          elif grep -q '\${VPS_HOST}' nextdeploy.yml; then
            echo "::error::VPS_HOST secret is required when nextdeploy.yml uses \${VPS_HOST}"
            exit 1
          fi
          if [ -n "$KEY" ]; then
            echo "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            cp ~/.ssh/id_ed25519 ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          if [ -n "$HOSTS" ]; then
            echo "$HOSTS" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          $RUN_PREFIX nextdeploy ship --verify
